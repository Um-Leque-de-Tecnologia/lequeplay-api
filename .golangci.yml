version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - revive
    - unconvert
    - whitespace

  exclusions:
    rules:
      # Testes podem ser mais relaxados em segurança
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
